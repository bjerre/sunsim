# sunsim's pure layers in Rust: the event vocabulary (ev), the application
# logic (sunsim-core), the weather replies' readers (weather), the
# platform's logic that needs no ESP-IDF (platform), the simulator (sim)
# and the browser simulator's wasm (web), with the host tests (tests/). No ESP-IDF here, as in the
# C++ components they mirror; `cargo test` runs everything.
[workspace]
resolver = "3"
members = ["ev", "core", "weather", "platform", "sim", "web", "tests"]
exclude = ["firmware"] # its own target and toolchain

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
log = "0.4"
ev = { path = "ev", package = "sunsim-ev" }
sunsim-core = { path = "core" }
weather = { path = "weather", package = "sunsim-weather" }
sim = { path = "sim", package = "sunsim-sim" }
platform = { path = "platform", package = "sunsim-platform" }
web = { path = "web", package = "sunsim-web" }

[workspace.lints.rust]
unsafe_code = "deny" # web/src/exports.rs alone allows it: the wasm exports

[workspace.lints.clippy]
await_holding_refcell_ref = "deny"

# The browser simulator's wasm: small (the host tests don't build release).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
